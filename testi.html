<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimoni - Ciccu Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(135deg, #e0f2fe, #fce7f3, #e0f2fe); 
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-logo { 
            font-family: 'Fredoka', sans-serif; 
            font-weight: 700;
            letter-spacing: 0.5px; 
        }

        body::before {
            content:'';
            position:fixed;
            inset:0;
            pointer-events:none;
            background-image:
                radial-gradient(circle, #ffffff 3px, transparent 4px),
                radial-gradient(circle, rgba(125, 211, 252, 0.6) 3px, transparent 4px),
                radial-gradient(circle, rgba(244, 114, 182, 0.4) 3px, transparent 4px);
            background-size: 45px 45px;
            background-position: 0 0, 15px 15px, 30px 30px;
            z-index: -1;
        }

        .fade-in-down { animation: fadeInDown 0.5s ease-out forwards; opacity: 0; transform: translateY(-15px); }
        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }

        /* Tata Letak Masonry Fleksibel Ala Pinterest / Padlet */
        .masonry-grid {
            column-count: 2; /* Tetap 2 ruang kolom menyamping (Kiri & Kanan) di HP */
            column-gap: 0.75rem;
        }
        .masonry-grid > div {
            break-inside: avoid;
            page-break-inside: avoid;
            -webkit-column-break-inside: avoid;
            margin-bottom: 0.75rem;
            display: inline-block;
            width: 100%;
        }
        @media (min-width: 768px) {
            .masonry-grid { column-count: 3; column-gap: 1.25rem; }
            .masonry-grid > div { margin-bottom: 1.25rem; }
        }
        @media (min-width: 1024px) {
            .masonry-grid { column-count: 4; }
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen relative overflow-x-hidden">
    
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div class="absolute top-10 left-10 text-4xl opacity-30 animate-bounce">❤︎</div>
      <div class="absolute top-40 right-20 text-3xl opacity-30 animate-pulse">🌸</div>
      <div class="absolute bottom-40 left-20 text-4xl opacity-30 animate-bounce">❤︎</div>
      <div class="absolute bottom-60 right-10 text-3xl opacity-30 animate-pulse">☁️</div>
    </div>

    <main class="px-5 w-full max-w-md md:max-w-4xl lg:max-w-6xl mx-auto pb-36 relative z-10 pt-8 md:pt-12"> 
        
        <div class="flex flex-col items-center justify-center text-center mb-8 fade-in-down">
            <h1 class="font-logo text-3xl sm:text-5xl md:text-6xl text-pink-500 drop-shadow-sm pb-1 whitespace-nowrap">❤︎ Kata<span class="text-sky-400">Mereka</span> ❤︎</h1>
            <p class="text-[9px] min-[360px]:text-[10px] md:text-xs text-pink-600 font-black uppercase tracking-[0.15em] sm:tracking-[0.2em] mt-3 bg-white/80 px-4 py-1.5 rounded-full shadow-sm backdrop-blur-md border border-pink-200 inline-block">
                ☁️ Testimoni Pelanggan ☁️
            </p>
        </div>

        <div class="fade-in-down mb-10 max-w-2xl mx-auto relative overflow-hidden bg-white/90 backdrop-blur-sm border border-pink-200 rounded-[2rem] shadow-xl shadow-pink-100/50 p-6 md:p-8">
            <div class="absolute -top-16 -right-16 w-32 h-32 bg-pink-300/30 blur-3xl rounded-full pointer-events-none"></div>
            <h2 class="font-bold text-lg md:text-xl text-pink-500 mb-4 text-center">Tinggalkan Jejak & Pesan! 🎀</h2>
            
            <form id="testimoniForm" class="space-y-4">
                <div>
                    <input type="text" id="inputNama" placeholder="Nama Kamu (Kosongkan untuk Anonim)" class="w-full bg-pink-50 border border-pink-200 text-xs md:text-sm rounded-xl p-3 md:p-4 outline-none focus:border-pink-400 font-bold text-gray-700 shadow-inner">
                </div>
                <div>
                    <textarea id="inputKomentar" rows="3" placeholder="Ketik komentarmu di sini yaa... ☁️✨" required class="w-full bg-pink-50 border border-pink-200 text-xs md:text-sm rounded-xl p-3 md:p-4 outline-none focus:border-pink-400 font-bold text-gray-700 shadow-inner resize-none"></textarea>
                </div>
                
                <div class="cf-turnstile mt-2 mb-2 flex justify-center" data-sitekey="0x4AAAAAADpiSjv84N_2_kvG"></div>

                <button type="submit" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 md:py-3.5 rounded-xl transition-all shadow-md shadow-pink-200 outline-none transform active:scale-95 flex items-center justify-center gap-2">
                    Kirim Testimoni <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>

        <div class="masonry-grid fade-in-down" id="testimoniGrid">
            </div>

        <div class="text-center mt-12 md:mt-20 pt-6 border-t border-pink-200 text-pink-400 text-[11px] font-bold tracking-widest uppercase">
            © 2026 Ciccu Store. All Rights Reserved.
        </div>
    </main>

    <script>
        const API_URL = "";
        const BASE_URL = API_URL.endsWith('/') ? API_URL.slice(0, -1) : API_URL;

        // Fungsi Sanitasi HTML (XSS Filter)
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[match]);
        }

        // Fungsi format tanggal sederhana
        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        // Fungsi untuk menarik data dari database
        async function loadTestimoni() {
            const grid = document.getElementById('testimoniGrid');
            grid.innerHTML = '<p class="col-span-full text-center text-pink-500 font-bold text-sm">Memuat testimoni... ☁️</p>';
            
            try {
                const res = await fetch(`${BASE_URL}/api/testimoni`);
                const data = await res.json();
                
                grid.innerHTML = ''; // Bersihkan tulisan loading
                
                if(data.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500 font-bold text-sm">Belum ada testimoni. Jadilah yang pertama! 🎀</p>';
                    return;
                }

                const colorClasses = ['text-pink-500 bg-pink-100 border-pink-200', 'text-sky-500 bg-sky-100 border-sky-200', 'text-purple-500 bg-purple-100 border-purple-200'];
                
                // 1. GUNAKAN FRAGMENT: Menampung elemen di memori agar tidak merender berulang kali
                const fragment = document.createDocumentFragment();

                data.forEach((item, index) => {
                    const randomColor = colorClasses[Math.floor(Math.random() * colorClasses.length)];
                    const textNameColor = randomColor.split(' ')[0];
                    const inisial = (item.nama || 'A').charAt(0).toUpperCase();

                    const safeNamaDisplay = escapeHTML(item.nama);
                    const safeKomentarDisplay = escapeHTML(item.komentar);
                    const safeBalasanDisplay = item.balasan_admin ? escapeHTML(item.balasan_admin) : '';
                    
                    // --- BLOK UI UNTUK BALASAN ADMIN ---
                    const balasanHtml = (item.balasan_admin && item.balasan_admin.trim() !== '') ? `
                        <div class="mt-3 bg-white border border-pink-100 rounded-xl p-3 shadow-inner">
                            <p class="text-[9px] md:text-[10px] font-black text-sky-500 mb-0.5">↳ Balasan Admin:</p>
                            <p class="text-[10px] md:text-xs text-gray-600 font-medium leading-relaxed">${safeBalasanDisplay}</p>
                        </div>
                    ` : '';

                    const card = document.createElement('div');
                    
                    // 2. OPTIMASI CSS: Hapus backdrop-blur, turunkan shadow, ganti bg transparan jadi solid
                    card.className = 'bg-white border border-pink-200 rounded-2xl md:rounded-3xl p-4 md:p-5 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all relative overflow-hidden group fade-in-down';
                    
                    // 3. OPTIMASI ANIMASI: Beri jeda kecil antar kartu agar tidak muncul bersamaan
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    card.innerHTML = `
                        <div class="flex items-center gap-2.5 mb-3">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full ${randomColor} border flex items-center justify-center font-black text-xs md:text-sm shrink-0">${inisial}</div>
                            <div>
                                <h3 class="text-xs md:text-sm font-black ${textNameColor} capitalize">${safeNamaDisplay}</h3>
                                <p class="text-[9px] md:text-[10px] text-gray-400 font-bold mt-0.5">${formatDate(item.created_at)}</p>
                            </div>
                        </div>
                        <p class="text-[11px] md:text-xs text-gray-600 font-medium leading-relaxed">
                            ${safeKomentarDisplay}
                        </p>
                        ${balasanHtml} 
                    `;
                    
                    // Masukkan ke memori sementara (bukan langsung ke layar)
                    fragment.appendChild(card);
                });
                
                // 4. RENDER SEKALI SAJA: Masukkan semua kartu yang sudah disusun ke layar secara serentak
                grid.appendChild(fragment);
                
            } catch (error) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-500 font-bold text-sm">Gagal memuat data. 🥺</p>';
            }
        }

        // Fungsi Submit Testimoni Baru ke Database
        document.getElementById('testimoniForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // AMBIL TOKEN TURNSTILE
            const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!turnstileToken) {
                return alert("Mohon tunggu dan selesaikan verifikasi keamanan Captcha terlebih dahulu ya! 🎀");
            }

            const btn = this.querySelector('button[type="submit"]');
            const oldText = btn.innerHTML;
            btn.innerHTML = 'Mengirim... ☁️';
            btn.disabled = true;

            const nama = document.getElementById('inputNama').value.trim();
            const komentar = document.getElementById('inputKomentar').value.trim();

            try {
                const res = await fetch(`${BASE_URL}/api/testimoni`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama, komentar, turnstileResponse: turnstileToken })
                });
                
                if(res.ok) {
                    this.reset(); // Kosongkan form
                    if (typeof turnstile !== 'undefined') turnstile.reset(); // Reset captcha
                    loadTestimoni(); // Refresh grid testimoni
                } else {
                    const errData = await res.json();
                    alert(errData.error || "Gagal mengirim testimoni. Coba lagi ya!");
                    if (typeof turnstile !== 'undefined') turnstile.reset(); // Reset captcha jika gagal
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
                if (typeof turnstile !== 'undefined') turnstile.reset();
            } finally {
                btn.innerHTML = oldText;
                btn.disabled = false;
            }
        });

        // Jalankan penarikan data saat halaman pertama kali dibuka
        loadTestimoni();
    </script>
</body>
</html>
