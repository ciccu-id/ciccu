<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS Payment - Ciccu Store</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="QRIS Payment - Ciccu Store">
    <meta property="og:image" content="https://raw.githubusercontent.com/ciccu-id/ciccu/20e07263a3725bad9648d97fd6e8b4d5bc88f56e/qris/qris.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="QRIS Payment - Ciccu Store">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/ciccu-id/ciccu/20e07263a3725bad9648d97fd6e8b4d5bc88f56e/qris/qris.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg,#fff1f7,#ffe4ef,#fff0f6); }
        body::before {
            content:'';position:fixed;inset:0;pointer-events:none;
            background-image:
            radial-gradient(circle at 15% 20%, rgba(244,114,182,.15) 3px, transparent 3px),
            radial-gradient(circle at 80% 30%, rgba(251,146,60,.08) 3px, transparent 3px),
            radial-gradient(circle at 40% 80%, rgba(244,114,182,.15) 3px, transparent 3px);
            background-size:90px 90px;
        }
        .font-fredoka { font-family: 'Fredoka', sans-serif; }
        
        /* Animasi */
        .fade-in-down { animation: fadeInDown 0.6s ease-out forwards; opacity: 0; transform: translateY(-15px); }
        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        
        /* Floating background items */
        .floaty { animation: floaty 3s ease-in-out infinite; }
        @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 h-[100dvh] overflow-hidden relative font-sans flex flex-col items-center justify-center">
    
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div class="absolute top-10 left-8 md:left-20 md:top-20 text-3xl md:text-5xl opacity-20 animate-bounce">❤︎</div>
      <div class="absolute top-32 right-8 md:right-32 md:top-40 text-2xl md:text-4xl opacity-20 floaty">🌸</div>
      <div class="absolute bottom-32 left-10 md:left-24 md:bottom-40 text-2xl md:text-4xl opacity-20 floaty" style="animation-delay: 1s;">✨</div>
      <div class="absolute bottom-16 right-8 md:right-24 md:bottom-24 text-3xl md:text-5xl opacity-20 animate-bounce">❤︎</div>
    </div>

    <main class="w-full max-w-sm md:max-w-md lg:max-w-lg px-5 md:px-0 relative z-10 flex flex-col items-center h-full justify-center max-h-[850px] py-4">
        
        <div class="w-full bg-white border border-pink-200 rounded-3xl md:rounded-[2rem] shadow-xl shadow-pink-100/50 p-6 md:p-8 flex flex-col items-center text-center relative overflow-hidden mb-4 md:mb-6 fade-in-down">
            <div class="absolute -top-12 -right-12 md:-top-16 md:-right-16 w-28 h-28 md:w-40 md:h-40 bg-pink-300/30 blur-2xl md:blur-3xl rounded-full pointer-events-none"></div>
            
            <h1 class="font-fredoka text-2xl md:text-3xl lg:text-4xl font-bold text-pink-500 tracking-wide mb-1 relative z-10">Pembayaran</h1>
            <p class="text-[11px] md:text-sm text-gray-500 font-medium leading-snug mb-5 relative z-10">
                Silakan scan QRIS di bawah ini atau <br> unduh untuk membayar.
            </p>

            <div onclick="openPreview()" class="relative w-full max-w-[240px] md:max-w-[280px] bg-white rounded-2xl p-2 border-2 border-dashed border-pink-300 shadow-md mb-6 z-10 group cursor-pointer transition-all duration-300 hover:border-pink-400">
                <img src="https://raw.githubusercontent.com/ciccu-id/ciccu/20e07263a3725bad9648d97fd6e8b4d5bc88f56e/qris/qris.jpg" alt="QRIS Ciccu Store" class="w-full h-auto rounded-xl object-contain transition-transform duration-300 group-hover:scale-[1.02]">
                <div class="absolute bottom-3 right-3 bg-pink-500/80 text-white p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
                </div>
            </div>

            <div class="w-full flex flex-col gap-3 relative z-10">
                <a href="https://raw.githubusercontent.com/ciccu-id/ciccu/20e07263a3725bad9648d97fd6e8b4d5bc88f56e/qris/qris.jpg" download="QRIS_Ciccu_Store.jpg" target="_blank" class="group w-full py-3 md:py-3.5 px-5 md:px-6 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-2xl md:rounded-3xl font-bold transition-all duration-300 shadow-lg shadow-pink-300/50 hover:shadow-xl hover:shadow-pink-400/50 hover:-translate-y-0.5 md:hover:-translate-y-1 flex items-center justify-center outline-none relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-20 h-20 bg-white opacity-10 rounded-full blur-xl transform translate-x-6 -translate-y-6 pointer-events-none"></div>
                    <div class="flex items-center gap-2 relative z-10">
                        <svg class="w-5 h-5 md:w-6 md:h-6 group-hover:animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="tracking-wide text-sm md:text-base">Download QRIS</span>
                    </div>
                </a>
            </div>
            
        </div>

        <div class="mt-2 mb-2 text-center text-pink-400 text-[10px] md:text-xs font-bold tracking-widest uppercase fade-in-down" style="animation-delay: 0.2s;">
            © 2026 Ciccu. All Rights Reserved.
        </div>

    </main>

    <div id="previewModal" onclick="closePreview()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 cursor-zoom-out opacity-0 transition-opacity duration-300">
        <div class="relative max-w-full max-h-full flex items-center justify-center scale-95 transition-transform duration-300" id="modalContainer">
            <img src="https://raw.githubusercontent.com/ciccu-id/ciccu/20e07263a3725bad9648d97fd6e8b4d5bc88f56e/qris/qris.jpg" alt="QRIS Besar" class="max-w-[92vw] max-h-[85vh] md:max-h-[90vh] rounded-2xl object-contain shadow-2xl border-4 border-white bg-white">
            <button class="absolute -top-12 right-0 md:-right-12 bg-white/20 hover:bg-white/40 text-white w-9 h-9 flex items-center justify-center rounded-full transition-colors text-xl font-bold">&times;</button>
        </div>
    </div>

    <script>
        function openPreview() {
            const modal = document.getElementById('previewModal');
            const container = document.getElementById('modalContainer');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            const container = document.getElementById('modalContainer');
            
            modal.classList.add('opacity-0');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }
    </script>
</body>
</html>
