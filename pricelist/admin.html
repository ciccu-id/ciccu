<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Ciccu Store</title>
    
    <meta name="theme-color" content="#fce7f3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Admin Ciccu">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="https://raw.githubusercontent.com/ciccu-id/ciccu/b553f21b7c60f88452032a100f8873bfb597daf7/lp.jpeg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/ciccu-id/ciccu/b553f21b7c60f88452032a100f8873bfb597daf7/lp.jpeg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fdf2f8; color: #1f2937; -webkit-tap-highlight-color: transparent; }
        .loader { border: 3px solid rgba(244, 114, 182, 0.2); border-left-color: #ec4899; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toggle-checkbox:checked { right: 0; border-color: #10B981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10B981; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #EF4444; border-radius: 9999px; transition: all 0.3s; }
        .toggle-circle { top: 0.125rem; left: 0.125rem; width: 1.25rem; height: 1.25rem; background-color: white; border-radius: 50%; transition: transform 0.3s; }
        .toggle-checkbox:checked ~ .toggle-circle { transform: translateX(1.5rem); }
    </style>
</head>
<body class="min-h-screen pb-20 pt-4 md:pt-0">

    <div id="loginOverlay" class="fixed inset-0 bg-pink-50 z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl shadow-pink-200 w-full max-w-sm text-center border border-pink-100">
            <img src="https://raw.githubusercontent.com/ciccu-id/ciccu/b553f21b7c60f88452032a100f8873bfb597daf7/lp.jpeg" alt="Logo" class="w-24 h-24 rounded-full mx-auto mb-4 shadow-md border-4 border-pink-100">
            <h2 class="text-2xl font-black text-pink-500 mb-1">Halo, Admin! 🌸</h2>
            <p class="text-sm text-gray-500 mb-6 font-bold">Masukkan password untuk masuk.</p>
            
            <input type="password" id="adminPasswordInput" placeholder="Ketik password..." class="w-full bg-pink-50 border border-pink-200 text-center rounded-2xl py-3 px-4 outline-none focus:border-pink-400 font-bold mb-4 text-pink-600 shadow-inner">
            <button onclick="loginAdmin()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 rounded-2xl transition-all shadow-md shadow-pink-200">Masuk ✨</button>
        </div>
    </div>

    <main class="max-w-3xl mx-auto p-4 md:p-6" id="mainContent" style="display: none;">
        <div class="mb-8 border-b border-pink-200 pb-4 mt-2 flex justify-between items-center">
            <h1 class="text-2xl font-black text-pink-500 drop-shadow-sm">❤︎ Ciccu<span class="text-sky-400">Admin</span></h1>
            <button onclick="logoutAdmin()" class="text-xs bg-pink-100 text-pink-500 font-bold px-3 py-1.5 rounded-xl border border-pink-200 hover:bg-pink-200">Keluar 🚪</button>
        </div>

        <div class="bg-white p-5 rounded-3xl border border-pink-200 shadow-xl shadow-pink-100/50 mb-6">
            <h2 class="text-sm font-bold text-pink-500 mb-4 uppercase tracking-wider">Tambah Paket Manual 🌸</h2>
            <form id="addForm" class="space-y-3" onsubmit="addData(event)">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="appName" placeholder="Nama Aplikasi" required class="col-span-2 bg-pink-50 border border-pink-200 text-sm rounded-xl p-3 outline-none focus:border-pink-400 w-full font-bold text-gray-700 shadow-inner">
                    <select id="appCat" required class="bg-pink-50 border border-pink-200 text-sm rounded-xl p-3 outline-none focus:border-pink-400 w-full font-bold text-gray-700 shadow-inner">
                        <option value="" disabled selected>Pilih Kategori</option>
                        <option value="streaming">Streaming</option>
                        <option value="music">Music</option>
                        <option value="editing">Editing</option>
                        <option value="study">Study Needs</option>
                    </select>
                    <input type="text" id="appDur" placeholder="Durasi" required class="bg-pink-50 border border-pink-200 text-sm rounded-xl p-3 outline-none focus:border-pink-400 w-full font-bold text-gray-700 shadow-inner">
                    <input type="text" id="appPrice" placeholder="Harga" required class="bg-pink-50 border border-pink-200 text-sm rounded-xl p-3 outline-none focus:border-pink-400 w-full font-bold text-gray-700 shadow-inner">
                    <select id="appStatus" class="bg-pink-50 border border-pink-200 text-sm rounded-xl p-3 outline-none focus:border-pink-400 w-full text-green-500 font-bold shadow-inner">
                        <option value="Ready" selected>Ready</option>
                        <option value="Sold" class="text-red-500">Sold</option>
                    </select>
                    <input type="text" id="appNotes" placeholder="Catatan (Opsional)" class="col-span-2 bg-pink-50 border border-pink-200 text-sm rounded-xl p-3 outline-none focus:border-pink-400 w-full font-bold text-gray-700 shadow-inner">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 rounded-xl transition-all mt-2 shadow-md">Simpan Data ✨</button>
            </form>
        </div>

        <div class="bg-white p-5 rounded-3xl border border-pink-200 shadow-xl shadow-pink-100/50 mb-6">
            <h2 class="text-sm font-bold text-pink-500 mb-2 uppercase tracking-wider">Upload dari CSV ☁️</h2>
            <div class="flex gap-2">
                <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-pink-100 file:text-pink-600 cursor-pointer">
                <button onclick="processCSV()" id="btnCsv" class="bg-pink-400 text-white px-4 py-2 rounded-xl text-sm font-bold border border-pink-500 hover:bg-pink-500 whitespace-nowrap shadow-sm">Upload</button>
            </div>
            <div id="csvProgress" class="text-xs text-pink-500 font-bold mt-2 hidden">Memproses...</div>
        </div>

        <div class="relative mb-4">
            <input type="text" id="adminSearchInput" oninput="filterAdminList()" placeholder="Cari aplikasi atau kategori..." class="w-full bg-white border border-pink-200 text-sm text-gray-700 rounded-2xl py-3 pl-10 pr-4 outline-none focus:border-pink-400 transition-colors shadow-sm font-bold">
            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                <svg class="w-4 h-4 text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <div id="dataList" class="space-y-3">
            <div class="text-center py-10"><div class="loader mx-auto mb-2"></div><p class="text-xs text-gray-500 font-bold">Memuat data...</p></div>
        </div>
    </main>

    <script>
        const API_URL = "https://ciccu.ygpentinggmail22.workers.dev"; 
        let globalAdminData = [];
        let sessionPass = "";

        // ----- SISTEM LOGIN -----
        function checkSession() {
            sessionPass = sessionStorage.getItem("ciccuAdminPass");
            if (sessionPass) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadData();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'none';
            }
        }

        function loginAdmin() {
            const input = document.getElementById('adminPasswordInput').value;
            if (!input) return alert("Isi passwordnya dulu ya!");
            sessionStorage.setItem("ciccuAdminPass", input);
            checkSession();
        }

        function logoutAdmin() {
            sessionStorage.removeItem("ciccuAdminPass");
            window.location.reload();
        }

        // Panggil pengecekan saat halaman dimuat
        checkSession();

        // ----- FUNGSI ADMIN -----
        
        // Cek response untuk error 403 (Password Salah)
        function handleResponseStatus(res) {
            if (res.status === 403) {
                alert("Gagal menyimpan! Password yang Anda masukkan salah.");
                logoutAdmin();
                throw new Error("Unauthorized");
            }
            return res.json();
        }

        async function loadData() {
            if(!sessionPass) return; // Jangan load jika belum login
            const list = document.getElementById('dataList');
            try {
                const response = await fetch(`${API_URL}/api/pricelist`);
                const data = await response.json();
                
                globalAdminData = data.sort((a, b) => a.id - b.id);
                renderData(globalAdminData);
            } catch (error) {
                list.innerHTML = `<div class="text-center py-10 text-red-500 font-bold text-sm bg-white rounded-2xl border border-red-200">Gagal memuat data. Cek koneksi internet.</div>`;
            }
        }

        function renderData(dataArray) {
            const list = document.getElementById('dataList');
            if (dataArray.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-gray-500 font-bold text-sm bg-white rounded-2xl border border-pink-200">Tidak ada paket aplikasi ditemukan.</div>`;
                return;
            }

            let html = '';
            dataArray.forEach(item => {
                const isReady = item.status === 'Ready';
                const statusColor = isReady ? 'text-green-500' : 'text-red-500';
                
                html += `
                    <div class="bg-white p-4 rounded-2xl border border-pink-200 flex justify-between items-center gap-2 transition-colors hover:border-pink-400 shadow-sm">
                        <div class="flex-1 overflow-hidden">
                            <h3 class="font-bold text-gray-800 text-base truncate">${item.app_name}</h3>
                            <p class="text-[10px] text-pink-400 font-bold uppercase tracking-widest mt-0.5">${item.category} • ${item.duration} • ${item.price}</p>
                            ${item.notes ? `<p class="text-[10px] text-gray-500 mt-1 italic font-medium">${item.notes}</p>` : ''}
                        </div>
                        
                        <div class="flex items-center gap-4 border-l border-pink-100 pl-4 ml-2">
                            <div class="flex flex-col items-center gap-1">
                                <span class="text-[9px] font-black ${statusColor} uppercase tracking-wider" id="status-text-${item.id}">${item.status}</span>
                                <div class="relative inline-block w-12 h-6 align-middle select-none">
                                    <input type="checkbox" id="toggle-${item.id}" ${isReady ? 'checked' : ''} onchange="toggleStatus(${item.id}, this.checked)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0"/>
                                    <label for="toggle-${item.id}" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                    <div class="toggle-circle absolute top-0.5 left-0.5 pointer-events-none"></div>
                                </div>
                            </div>
                            <button onclick="deleteData(${item.id})" class="text-pink-300 hover:text-red-500 bg-pink-50 p-2 rounded-xl transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function filterAdminList() {
            const keyword = document.getElementById('adminSearchInput').value.toLowerCase();
            const filteredData = globalAdminData.filter(item => {
                return item.app_name.toLowerCase().includes(keyword) || 
                       item.category.toLowerCase().includes(keyword) ||
                       item.status.toLowerCase().includes(keyword);
            });
            renderData(filteredData);
        }

        async function addData(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = "Menyimpan..."; btn.disabled = true;

            const payload = {
                app_name: document.getElementById('appName').value,
                category: document.getElementById('appCat').value,
                duration: document.getElementById('appDur').value,
                price: document.getElementById('appPrice').value,
                status: document.getElementById('appStatus').value,
                notes: document.getElementById('appNotes').value,
            };

            try {
                const res = await fetch(`${API_URL}/api/pricelist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-password': sessionPass },
                    body: JSON.stringify(payload)
                });
                await handleResponseStatus(res);
                
                document.getElementById('addForm').reset();
                document.getElementById('adminSearchInput').value = ''; 
                loadData();
            } catch (error) {
                console.error(error);
            } finally {
                btn.innerHTML = "Simpan Data ✨"; btn.disabled = false;
            }
        }

        async function toggleStatus(id, isChecked) {
            const newStatus = isChecked ? 'Ready' : 'Sold';
            const statusTextEl = document.getElementById(`status-text-${id}`);
            
            // Perubahan visual sementara
            statusTextEl.innerText = newStatus;
            statusTextEl.className = `text-[9px] font-black ${isChecked ? 'text-green-500' : 'text-red-500'} uppercase tracking-wider`;

            try {
                const res = await fetch(`${API_URL}/api/status/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'x-admin-password': sessionPass },
                    body: JSON.stringify({ status: newStatus })
                });
                await handleResponseStatus(res);

                // Update data global jika berhasil
                const itemIndex = globalAdminData.findIndex(item => item.id === id);
                if (itemIndex !== -1) globalAdminData[itemIndex].status = newStatus;
            } catch (error) {
                loadData(); // Revert visual jika gagal
            }
        }

        async function deleteData(id) {
            if(!confirm("Yakin ingin menghapus paket ini?")) return;
            
            try {
                const res = await fetch(`${API_URL}/api/delete/${id}`, { 
                    method: 'DELETE',
                    headers: { 'x-admin-password': sessionPass } 
                });
                await handleResponseStatus(res);
                loadData();
            } catch (error) {
                console.error(error);
            }
        }

        async function processCSV() {
            const fileInput = document.getElementById('csvFile');
            const progress = document.getElementById('csvProgress');
            const file = fileInput.files[0];
            
            if (!file) return alert("Pilih file CSV dulu!");
            progress.classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split(/\r?\n/).slice(1); 
                
                let successCount = 0;
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row.trim()) continue;
                    
                    const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    if (cols.length < 4) continue;

                    progress.innerText = `Mengirim baris ${i + 1} dari ${rows.length}...`;
                    
                    try {
                        const res = await fetch(`${API_URL}/api/pricelist`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-password': sessionPass },
                            body: JSON.stringify({
                                app_name: cols[0], category: cols[1], duration: cols[2], 
                                price: cols[3], notes: cols[4] || '', status: 'Ready'
                            })
                        });
                        await handleResponseStatus(res);
                        successCount++;
                    } catch (error) {
                        break; // Stop looping jika password salah / error
                    }
                }
                progress.innerText = `Selesai! ${successCount} data berhasil diunggah.`;
                setTimeout(() => progress.classList.add('hidden'), 3000);
                fileInput.value = '';
                document.getElementById('adminSearchInput').value = ''; 
                loadData();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
